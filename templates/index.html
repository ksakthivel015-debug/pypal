<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PlaceMate - Placement Cell Assistant</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #eef2f7;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .chat-container {
    width: 420px;
    max-width: 95vw;
    height: 620px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    background: #b8860b;
    color: #fff;
    padding: 16px;
    text-align: center;
  }

  .chat-header h1 {
    margin: 0;
    font-size: 18px;
  }

  .chat-header p {
    margin: 4px 0 0;
    font-size: 12px;
    opacity: 0.85;
  }

  .chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #f7f9fc;
  }

  .message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .message.user {
    align-self: flex-end;
    background: #b8860b;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .message.bot {
    align-self: flex-start;
    background: #f0ead6;
    color: #222;
    border-bottom-left-radius: 4px;
  }

  .message.bot.typing {
    font-style: italic;
    opacity: 0.7;
  }

  .chat-input {
    display: flex;
    border-top: 1px solid #ddd;
    padding: 10px;
    gap: 8px;
    background: #fff;
  }

  .chat-input input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 20px;
    outline: none;
    font-size: 14px;
  }

  .chat-input input:focus {
    border-color: #b8860b;
  }

  .chat-input button {
    background: #b8860b;
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 10px 18px;
    cursor: pointer;
    font-size: 14px;
  }

  .chat-input button:hover {
    background: #966e08;
  }

  .chat-input button:disabled {
    background: #ddc98a;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h1>PlaceMate</h1>
    <p>Your Placement Cell Study Assistant</p>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="message bot">
      Hi! I'm PlaceMate. Ask me anything about placement preparation.
    </div>
  </div>

  <div class="chat-input">
    <input
      type="text"
      id="userInput"
      placeholder="Ask a placement-related question..."
      autocomplete="off"
    />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  const chatMessages = document.getElementById("chatMessages");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  function appendMessage(text, sender) {
    const msgDiv = document.createElement("div");
    msgDiv.classList.add("message", sender);
    msgDiv.textContent = text;
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return msgDiv;
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    appendMessage(text, "user");
    userInput.value = "";
    sendBtn.disabled = true;

    const typingDiv = appendMessage("PlaceMate is typing...", "bot typing");

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });

      const data = await res.json();
      typingDiv.remove();
      appendMessage(data.reply || "Sorry, something went wrong.", "bot");
    } catch (err) {
      typingDiv.remove();
      appendMessage("Network error. Please try again.", "bot");
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      sendMessage();
    }
  });
</script>

</body>
</html>
